# SPDX-License-Identifier: Apache-2.0
name: release

# This manual workflow separates Release Please proposal creation from trusted
# publication. The first public 0.1.0 publication is an interactive owner
# action and is never eligible for OIDC publication here.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create/update a Release Please proposal, or publish an existing release tag.
        required: true
        type: choice
        options:
          - prepare
          - publish
      release_tag:
        description: Existing vX.Y.Z tag to publish; required only for publish retries.
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap-gate:
    name: verify manual bootstrap
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the manual 0.1.0 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_version="$(npm view @bajrang0789/agentic-sdlc-kit@0.1.0 version --json)"
          if [[ "$bootstrap_version" != '"0.1.0"' ]]; then
            echo "The manual public 0.1.0 bootstrap has not been verified; OIDC releases remain disabled." >&2
            exit 1
          fi

  release-please:
    name: prepare release
    needs: bootstrap-gate
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Create or update release proposal
        id: release-please
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish trusted release
    needs:
      - bootstrap-gate
      - release-please
    if: >-
      always() && needs.bootstrap-gate.result == 'success' &&
      ((inputs.operation == 'prepare' && needs.release-please.outputs.release_created == 'true') ||
      inputs.operation == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.operation == 'publish' && inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Require a retry tag when publishing an existing release
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "A publish retry requires an existing vX.Y.Z release_tag." >&2
            exit 1
          fi

      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Reject bootstrap, published, or mismatched release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; process.stdout.write(JSON.parse(await readFile('package.json', 'utf8')).version);")"
          if [[ "$version" == "0.1.0" ]]; then
            echo "0.1.0 is a manual interactive bootstrap and cannot be published through OIDC." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version." >&2
            exit 1
          fi
          if npm view "@bajrang0789/agentic-sdlc-kit@$version" version --json >/dev/null 2>&1; then
            echo "Refusing to publish an npm version that already exists: $version" >&2
            exit 1
          fi

      - name: Verify accepted release contents and version agreement
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          GROUNDTRAIL_RELEASE_TAG="$RELEASE_TAG" npm run release:check-version
          npm run check
          npm pack --dry-run

      - name: Build release package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          package_file="$(npm pack --json | node --input-type=module -e "let data=''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data)[0].filename));")"
          mv "$package_file" release-artifacts/
          (
            cd release-artifacts
            sha256sum -- *.tgz > SHA256SUMS
          )

      - name: Create SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/groundtrail.spdx.json

      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm publish release-artifacts/*.tgz --access public --provenance

      - name: Attach verified release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/SHA256SUMS release-artifacts/groundtrail.spdx.json --clobber

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-artifacts/*

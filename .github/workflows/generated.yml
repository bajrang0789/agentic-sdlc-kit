# SPDX-License-Identifier: Apache-2.0
name: generated

on:
  push:
    branches:
      - main
      - vorflux/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify generated carriers
        run: npm run carriers:check
